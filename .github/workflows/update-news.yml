name: Update news

on:
  schedule:
    - cron: "0 */2 * * *" # 每 2 小时（UTC）；GitHub 定时可能有几分钟延迟
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]
    paths: [docs/**, apk/**, scripts/**, config/**]

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch RSS & probe archives
        timeout-minutes: 50
        env:
          # 可选：手动获取的 cf_clearance（见 README「机器验证处理」）
          ARCHIVE_COOKIE: ${{ secrets.ARCHIVE_COOKIE }}
          ARCHIVE_UA: ${{ secrets.ARCHIVE_UA }}
          # 可选：nopecha 打码服务 key（小规模自动解题尝试）
          NOPECHA_API_KEY: ${{ secrets.NOPECHA_API_KEY }}
          # 可选：官方 API key（无 key 自动回落 RSS）
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          # 可选：jina key（提升正文抓取配额）+ 私有正文缓存 token
          JINA_KEY: ${{ secrets.JINA_KEY }}
          NEWS_CACHE_TOKEN: ${{ secrets.NEWS_CACHE_TOKEN }}
          # 整轮墙钟预算：到点停止网络任务并写出已完成部分（解决 CI 超时）
          NEWS_BUDGET_SECONDS: "2400"
          # 各阶段预算（单条/单轮）
          MAX_PROBES_PER_RUN: "35"
          PROBE_WORKERS: "2"
          PROBE_TOTAL_TIMEOUT: "45"
          AUTO_ARCHIVE_BUDGET: "6"
          SYND_BUDGET: "6"
          DIRECT_TEXT_BUDGET: "16"
          DIRECT_TEXT_WORKERS: "2"
          READ_TEXT_BUDGET: "20"
          TEXT_WORKERS: "2"
          OG_IMAGE_BUDGET: "15"
        run: python scripts/fetch_news.py

      - name: Commit news.json & cache (also after timeout)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json data/cache.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "update news & cache [skip ci]"
          git pull --rebase origin main
          for i in 1 2 3; do git push && break || sleep 20; done

  apk:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 拿到 update job 刚推送的最新提交

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check apk source change (源码没变就跳过构建与发布，避免每轮定时任务都弹更新)
        id: srcgate
        run: |
          SRC_SHA=$(find apk -type f \
            ! -path 'apk/build/*' ! -path 'apk/.gradle/*' ! -path 'apk/app/build/*' \
            ! -name 'version.properties' ! -name 'local.properties' \
            -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          OLD=$(python -c "import json;print(json.load(open('docs/app-version.json')).get('apkSrcSha256',''))" 2>/dev/null || echo "")
          echo "sha=$SRC_SHA" >> "$GITHUB_OUTPUT"
          if [ "$SRC_SHA" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "APK 源码未变化，跳过构建与发布"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure signing keystore (首次构建自动生成并提交回仓库)
        if: steps.srcgate.outputs.changed == 'true'
        run: |
          if [ ! -f apk/signing/release.jks ]; then
            mkdir -p apk/signing
            keytool -genkeypair -v -keystore apk/signing/release.jks \
              -storepass journal123 -keypass journal123 -alias journal \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Journal, OU=Personal, O=Personal, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apk/signing/release.jks
            git commit -m "chore: bootstrap apk signing keystore [skip ci]"
            git pull --rebase origin main
            for i in 1 2 3; do git push && break || sleep 20; done
          fi

      - name: Compute version (供 APK 与更新检测共用)
        if: steps.srcgate.outputs.changed == 'true'
        run: |
          VC=$(( $(date -u +%s) / 60 ))
          { echo "versionCode=$VC"
            echo "versionName=$(date -u +%Y.%m.%d)"
          } > apk/version.properties

      - name: Build release APK
        if: steps.srcgate.outputs.changed == 'true'
        working-directory: apk
        run: |
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew --no-daemon assembleRelease

      - name: Publish APK（Pages 同源下载 + Release，就地更新）
        if: steps.srcgate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VC=$(grep versionCode apk/version.properties | cut -d= -f2)
          VN=$(grep versionName apk/version.properties | cut -d= -f2)
          SHA=$(sha256sum apk/app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)
          SRC_SHA="${{ steps.srcgate.outputs.sha }}"
          cp apk/app/build/outputs/apk/release/app-release.apk docs/Journal.apk
          printf '{"versionCode": %s, "versionName": "%s", "apkSha256": "%s", "apkSrcSha256": "%s"}\n' "$VC" "$VN" "$SHA" "$SRC_SHA" > docs/app-version.json
          git add docs/Journal.apk docs/app-version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish apk [skip ci]"
          git pull --rebase origin main
          for i in 1 2 3; do git push && break || sleep 20; done
          cp apk/app/build/outputs/apk/release/app-release.apk Journal.apk
          # 就地更新 Release，绝不删除 tag 重建；一次只上传一个资产文件——
          # gh 对同一命令里两个同名文件（Journal.apk + docs/Journal.apk）会在
          # uploads.github.com 上持续 404（2026-11-01..03 连续 14 次 run 失败的根因，
          # 本机用户 token 可稳定复现，与 GITHUB_TOKEN/runner 无关）
          TITLE="Journal APK ($VN)"
          NOTES="自动构建于 commit ${GITHUB_SHA::7}。应用内更新按钮会自动下载安装；也可手动下载 Journal.apk 侧载。"
          ok=0
          for i in 1 2 3 4 5; do
            if gh release view apk-latest >/dev/null 2>&1; then
              if gh release upload apk-latest Journal.apk --clobber && \
                 gh release edit apk-latest --title "$TITLE" --notes "$NOTES" >/dev/null; then
                ok=1
              fi
            else
              if gh release create apk-latest Journal.apk \
                --title "$TITLE" --notes "$NOTES"; then
                ok=1
              fi
            fi
            if [ "$ok" = "1" ]; then break; fi
            echo "Release 发布第 $i 次失败，30s 后重试"
            sleep 30
          done
          if [ "$ok" != "1" ]; then echo "::error::Release 发布反复失败"; exit 1; fi
