name: Test text cache

on:
  workflow_dispatch:
    inputs:
      count:
        description: "抽取条数"
        default: "3"
        type: string
      urls:
        description: "直接指定 URL（逗号分隔，提供时优先于 count）"
        default: ""
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug jina on wayback (with key)
        env:
          JINA_KEY: ${{ secrets.JINA_KEY }}
        run: |
          curl -s -o /tmp/w.md -w "http:%{http_code} bytes:%{size_download}\n" -m 90 \
            -H "Authorization: Bearer $JINA_KEY" \
            "https://r.jina.ai/https://web.archive.org/web/2/https://www.wsj.com/articles/%E4%B8%AD%E5%9B%BD%E5%AF%B9%E5%8F%B0%E6%B9%BE%E5%86%9B%E6%BC%94"
          head -c 300 /tmp/w.md 2>/dev/null; echo

      - name: Fetch via jina -> denoise -> store news-cache -> read back
        env:
          NEWS_CACHE_TOKEN: ${{ secrets.NEWS_CACHE_TOKEN }}
          JINA_KEY: ${{ secrets.JINA_KEY }}
          COUNT: ${{ inputs.count }}
          URLS: ${{ inputs.urls }}
        run: |
          python -X utf8 - <<'PY'
          import hashlib, json, os, sys
          sys.path.insert(0, "scripts")
          import readability as rd

          data = json.load(open("docs/news.json", encoding="utf-8"))
          n = int(os.environ.get("COUNT", "3"))
          override = os.environ.get("URLS", "").strip()
          if override:
              items = []
              for u in override.split(","):
                  u = u.strip()
                  if u:
                      items.append({"url": u, "title": "(指定URL)",
                                    "id": hashlib.sha1(u.encode()).hexdigest()[:12]})
          else:
              items = data["items"][:n]
          token = os.environ["NEWS_CACHE_TOKEN"]
          jkey = os.environ.get("JINA_KEY", "").strip() or None
          print(f"jina key: {'已配置' if jkey else '未配置（匿名）'}")
          for it in items:
              blocks = rd.fetch_text(it["url"], key=jkey)
              stored = False
              if blocks:
                  payload = {"url": it["url"], "title": it["title"], "fetched_at": "ci-test",
                             "blocks": blocks}
                  stored = rd.cache_put(token, repo := "lin-z-h/news-cache", it["id"] + ".json", payload)
              print(f"[fetch] blocks={len(blocks or [])} stored={stored} | {it['url'][:70]}")
              back = rd.cache_read(token, repo, it["id"] + ".json")
              paras = sum(1 for b in (back or {}).get("blocks", []) if "text" in b)
              head = next((b["text"][:60] for b in (back or {}).get("blocks", []) if "text" in b), "")
              print(f"[read-back] paras={paras} | {head}")
              print("---")
          print("DONE")
          PY