<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal</title>
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1915'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23f6f4ef' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<header class="masthead">
  <h1>Journal</h1>
  <p id="date-line"></p>
</header>
<section class="tools">
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search stories">
  </label>
  <button id="savedToggle" class="tool" aria-pressed="false" aria-label="Saved stories">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4.2L6 21z"/></svg>
  </button>
  <button id="viewToggle" class="tool" aria-pressed="false" aria-label="Compact view">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <button id="themeToggle" class="tool" aria-label="Theme: system"></button>
</section>
<div class="dock">
  <div class="chipsrow"><div class="track" id="sourceTrack" data-kind="source"></div></div>
  <div class="chipsrow"><div class="track" id="topicTrack" data-kind="topic"></div></div>
  <div class="meta" id="meta"></div>
</div>
<main id="list" class="list"></main>
<footer class="foot" id="foot"></footer>
<div id="reader" class="reader" hidden>
  <div class="rhead">
    <button id="readerExport" class="tool" aria-label="Export PDF" title="导出 PDF">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
    </button>
    <button id="readerClose" class="tool" aria-label="Close reader">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="rwrap">
    <h1 id="rTitle" class="rtitle"></h1>
    <div id="rMeta" class="rmeta"></div>
    <div id="rBody" class="rbody"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=17"></script>
</body>
</html>
