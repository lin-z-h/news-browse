plugins {
    id 'com.android.application'
}

// versionCode 优先读 CI 写入的 version.properties（保证线上 app-version.json 与
// APK 内部版本一致，用于更新检测）；本地直接构建时退化为"构建分钟数"。
def vcProps = new Properties()
def vpFile = rootProject.file("version.properties")
if (vpFile.exists()) vcProps.load(new FileInputStream(vpFile))
def vc = (vcProps.getProperty("versionCode") ?: "${(System.currentTimeMillis() / 60000L) as int}") as int
def vName = vcProps.getProperty("versionName") ?: new Date().format("yyyy.MM.dd")

android {
    namespace 'com.linz.journal'
    compileSdk 34

    defaultConfig {
        applicationId "com.linz.journal"
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName vName
    }

    signingConfigs {
        release {
            // keystore 首次由 CI 自动生成并提交回仓库（个人自用，签名仅用于
            // 保证"覆盖安装不换签名"，不含任何敏感内容）
            storeFile rootProject.file("signing/release.jks")
            storePassword "journal123"
            keyAlias "journal"
            keyPassword "journal123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1' // FileProvider：更新包安装
}
